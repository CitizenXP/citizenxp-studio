<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Source</title>
<script src="config.js"></script>
<script src="theme.js"></script>
<link rel="stylesheet" href="studio.css">
<style>
	/* An OBS browser source. It stays completely black until a clip plays, so it can
	   sit in the scene permanently and simply light up when the producer rolls one. */
	html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
	#engine { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; left: -9999px; }
	#clipLayer {
		position: fixed; inset: 0; background: #000;
		display: flex; align-items: center; justify-content: center;
	}
	#clipLayer video, #clipYt, #clipYt iframe { width: 100%; height: 100%; display: block; border: 0; background: #000; }
	#clipLayer video { object-fit: contain; }

	/* Nothing below is ever on camera: it only shows while you are setting the source
	   up in a normal browser tab, and disappears the moment a clip starts. */
	#status {
		position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 18px;
		font: 500 0.82rem/1.5 var(--font-ui, system-ui), sans-serif;
		color: var(--text-dim, #8b93a7); background: rgba(10, 13, 20, 0.9);
		border-top: 1px solid var(--line, #232a3a);
	}
	#status b { color: var(--text, #e8ecf4); }
	body.playing #status { display: none; }
	body.playing #clipLayer { background: #000; }
</style>
</head>
<body>
	<iframe id="engine" allow="autoplay; microphone; camera" title="clip control channel"></iframe>

	<div id="clipLayer">
		<video id="clipVideo" playsinline preload="auto"></video>
		<div id="clipYt"></div>
	</div>

	<div id="status">
		<b>Clip source</b> <span id="statusText">connecting to the show...</span>
	</div>

<script src="common.js"></script>
<script src="clips.js"></script>
<script>
(function () {
	"use strict";
	const $ = id => document.getElementById(id);
	const CFG = window.STUDIO_CONFIG || {};

	// Same ?e= payload style as the guest invite, so one copy-link button in the
	// control room produces a source that already knows the room and password.
	let EV = {};
	try {
		const raw = new URLSearchParams(location.search).get("e");
		if (raw) EV = Studio.b64uDecode(raw) || {};
	} catch (e) {}

	if (!EV.m) {
		$("statusText").textContent = "this link is missing the show details. Copy it again from the control room.";
		return;
	}

	function setStatus(t) { $("statusText").textContent = t; }

	const Clips = window.StudioClips.create({
		layer: $("clipLayer"), video: $("clipVideo"), yt: $("clipYt"),
		stage: null,
		onShow: function (on) {
			document.body.classList.toggle("playing", on);
			if (!on) setStatus("idle, waiting for the next clip.");
		},
		onReport: function (state, detail) {
			if (state === "ready") setStatus("clip loaded and ready.");
			else if (state === "playing") setStatus("playing.");
			else if (state === "fail") setStatus("problem: " + (detail || "unknown"));
		}
	});

	// Join as an OBS scene rather than as a room member. A member that publishes
	// nothing never forms a peer connection, so the producer's commands could not
	// reach it; a scene connects to the director (and only the director), which is
	// exactly the control channel we want and costs no guest video at all.
	const params = {
		room: EV.m,
		scene: 0,
		cleanoutput: null,
		tips: 0
	};
	if (EV.p) params.password = EV.p;
	$("engine").src = Studio.buildUrl(Studio.vdoBase(), params);

	let connected = false;
	// Both delivery paths below can fire for the same command, so ignore an identical
	// token arriving twice within a moment of itself.
	let lastToken = "", lastAt = 0;
	function onToken(raw) {
		raw = String(raw).replace(/<[^>]*>/g, "").trim();
		if (!/^⏺CLIP\b/.test(raw)) return;
		const now = Date.now();
		if (raw === lastToken && now - lastAt < 1200) return;
		lastToken = raw; lastAt = now;
		Clips.handle(raw);
	}

	// The engine is same-origin, so hook its chat sink directly. That is far more
	// dependable than waiting for a postMessage that a scene may never send.
	const hook = setInterval(function () {
		let w = null;
		try { w = $("engine").contentWindow; } catch (e) { return; }
		if (!w || typeof w.getChatMessage !== "function" || w.__clipHooked) return;
		w.__clipHooked = true;
		clearInterval(hook);
		connected = true;
		setStatus("connected. Waiting for a clip.");
		const orig = w.getChatMessage;
		w.getChatMessage = function (msg) {
			try { if (msg && msg.msg) onToken(msg.msg); } catch (e) {}
			return orig.apply(this, arguments);
		};
	}, 400);
	setTimeout(function () {
		clearInterval(hook);
		if (!connected) setStatus("could not reach the show. Check the room is live, then reload this source.");
	}, 40000);

	// Belt and braces: some builds also post chat up to the parent.
	window.addEventListener("message", function (e) {
		if (!e.data || e.source !== $("engine").contentWindow) return;
		const c = e.data.chat || e.data.gotChat;
		if (c && c.msg && c.type !== "sent") onToken(c.msg);
	});

	// Preload every published clip while the source sits idle before the show, so the
	// first cut to it is instant rather than a few seconds of buffering on air.
	Clips.manifest().then(function (list) {
		if (!list.length) { setStatus("connected, but no clips are published yet."); return; }
		setStatus("connected. " + list.length + " clip" + (list.length === 1 ? "" : "s") + " available.");
		list.filter(c => c.type === "file").forEach(function (c) {
			fetch("clips/" + c.src, { cache: "force-cache" }).then(r => r.blob()).catch(function () {});
		});
	});
})();
</script>
</body>
</html>
